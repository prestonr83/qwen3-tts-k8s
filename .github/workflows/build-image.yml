name: Build image

# Builds the Qwen3-TTS server in this repo (CUDA 12.8) and pushes it to GHCR.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - requirements.txt
      - app/**
      - .github/workflows/build-image.yml
  workflow_dispatch:
    inputs:
      qwen_tts_version:
        description: "qwen-tts PyPI version (blank = Dockerfile default)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/qwen3-tts-server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # PyTorch + CUDA wheels make a multi-GB image; the stock runner doesn't have enough free disk.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Short sha
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build args
        id: args
        run: |
          V="${{ github.event.inputs.qwen_tts_version }}"
          if [ -n "$V" ]; then echo "args=QWEN_TTS_VERSION=$V" >> "$GITHUB_OUTPUT"; else echo "args=" >> "$GITHUB_OUTPUT"; fi

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.sha.outputs.short }}
          labels: |
            org.opencontainers.image.title=qwen3-tts-server
            org.opencontainers.image.description=Qwen3-TTS voice-clone server (CUDA 12.8)

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: ${{ steps.args.outputs.args }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.sha.outputs.short }}"
            echo "${{ env.IMAGE }}:latest"
            echo '```'
            echo "Pin it: set \`newTag: ${{ steps.sha.outputs.short }}\` in k8s/kustomization.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
