apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-subnets-only
  namespace: tts
spec:
  ipAllowList:
    sourceRange:
    - 10.0.0.0/16
    - 192.168.100.0/24
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: tts
spec:
  headers:
    browserXssFilter: true
    contentTypeNosniff: true
    forceSTSHeader: true
    referrerPolicy: no-referrer-when-downgrade
    stsIncludeSubdomains: true
    stsSeconds: 31536000